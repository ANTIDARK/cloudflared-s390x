name: Build cloudflared (s390x)

on:
  workflow_dispatch:

jobs:
  build-s390x:
    name: Build s390x
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build cloudflared for s390x
        env:
          TARGET_ARCH: s390x
          TARGET_OS: linux
        run: |
          set -e
          go version
          make cloudflared TARGET_ARCH=${TARGET_ARCH} TARGET_OS=${TARGET_OS}
          mkdir -p dist
          mv cloudflared dist/cloudflared-linux-${TARGET_ARCH}

      - name: Generate release tag from build time
        id: release_tag
        run: |
          echo "tag=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload build to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: dist/cloudflared-linux-s390x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
