name: Build cloudflared (s390x)-artifact

on:
  #push:
    #branches: ["master"]
  #pull_request:
    #branches: ["master"]
  workflow_dispatch: {}

jobs:
  build-s390x:
    name: Build s390x
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build cloudflared for s390x
        env:
          TARGET_ARCH: s390x
          TARGET_OS: linux
        run: |
          set -e
          go version
          make cloudflared TARGET_ARCH=${TARGET_ARCH} TARGET_OS=${TARGET_OS}
          mkdir -p dist
          mv cloudflared dist/cloudflared-linux-${TARGET_ARCH}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-linux-s390x
          path: dist/cloudflared-linux-s390x
